<nav class="navbar navbar-dark bg-primary mb-4">
  <div class="container">
    <span class="navbar-brand fw-semibold">Product Manager</span>
    <span class="navbar-text small">Angular + ASP.NET Core + SQL Server</span>
  </div>
</nav>

<main class="container pb-5">
  @if (alert(); as alert) {
    <div class="alert alert-{{ alert.type }} alert-dismissible" role="alert">
      {{ alert.text }}
      <button
        type="button"
        class="btn-close"
        aria-label="Close"
        (click)="this.alert.set(null)"
      ></button>
    </div>
  }

  <div class="row g-4">
    <div class="col-lg-4">
      <app-product-form
        [product]="editing()"
        [saving]="saving()"
        [disabled]="busy()"
        (submitted)="save($event)"
        (cancelled)="editing.set(null)"
      />
    </div>
    <div class="col-lg-8">
      <div class="d-flex justify-content-between align-items-center mb-2">
        <h2 class="h5 mb-0">Products ({{ products().length }})</h2>
        <button
          class="btn btn-sm btn-outline-secondary"
          [disabled]="busy()"
          (click)="load()"
        >
          Refresh
        </button>
      </div>
      <app-product-table
        [products]="products()"
        [loading]="loading()"
        [disabled]="busy()"
        [editingId]="editing()?.id"
        (edit)="edit($event)"
        (remove)="toDelete.set($event)"
      />
    </div>
  </div>
</main>

<app-confirm-delete-modal
  [product]="toDelete()"
  [deleting]="deleting()"
  (confirmed)="confirmDelete()"
  (cancelled)="toDelete.set(null)"
/>
