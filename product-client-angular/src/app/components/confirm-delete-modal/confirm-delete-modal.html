@if (product(); as product) {
  <div class="modal d-block" tabindex="-1" role="dialog" aria-modal="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Delete product</h5>
          <button
            type="button"
            class="btn-close"
            aria-label="Close"
            [disabled]="deleting()"
            (click)="dismiss()"
          ></button>
        </div>
        <div class="modal-body">
          Are you sure you want to delete <strong>{{ product.name }}</strong>? This cannot be
          undone.
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" [disabled]="deleting()" (click)="dismiss()">
            Cancel
          </button>
          <button class="btn btn-danger" [disabled]="deleting()" (click)="confirmed.emit()">
            @if (deleting()) {
              <span class="spinner-border spinner-border-sm me-2"></span>
            }
            Delete
          </button>
        </div>
      </div>
    </div>
  </div>
  <div class="modal-backdrop show"></div>
}
