<div class="card shadow-sm">
  <div class="card-header fw-semibold">
    {{ product() ? 'Edit product #' + product()!.id : 'Add new product' }}
  </div>
  <div class="card-body">
    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="mb-3">
        <label for="name" class="form-label">Name *</label>
        <input
          id="name"
          class="form-control"
          formControlName="name"
          [class.is-invalid]="error('name')"
          (input)="clearServerError('name')"
        />
        <div class="invalid-feedback">{{ error('name') }}</div>
      </div>

      <div class="mb-3">
        <label for="description" class="form-label">Description</label>
        <textarea
          id="description"
          rows="2"
          class="form-control"
          formControlName="description"
          [class.is-invalid]="error('description')"
          (input)="clearServerError('description')"
        ></textarea>
        <div class="invalid-feedback">{{ error('description') }}</div>
      </div>

      <div class="row">
        <div class="col-sm-6 mb-3">
          <label for="price" class="form-label">Price *</label>
          <input
            id="price"
            type="number"
            step="0.01"
            min="0"
            class="form-control"
            formControlName="price"
            [class.is-invalid]="error('price')"
            (input)="clearServerError('price')"
          />
          <div class="invalid-feedback">{{ error('price') }}</div>
        </div>
        <div class="col-sm-6 mb-3">
          <label for="quantity" class="form-label">Quantity *</label>
          <input
            id="quantity"
            type="number"
            step="1"
            min="0"
            class="form-control"
            formControlName="quantity"
            [class.is-invalid]="error('quantity')"
            (input)="clearServerError('quantity')"
          />
          <div class="invalid-feedback">{{ error('quantity') }}</div>
        </div>
      </div>

      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary" [disabled]="disabled()">
          @if (saving()) {
            <span class="spinner-border spinner-border-sm me-2"></span>
          }
          {{ product() ? 'Save changes' : 'Add product' }}
        </button>
        @if (product()) {
          <button
            type="button"
            class="btn btn-outline-secondary"
            [disabled]="disabled()"
            (click)="cancelled.emit()"
          >
            Cancel
          </button>
        }
      </div>
    </form>
  </div>
</div>
