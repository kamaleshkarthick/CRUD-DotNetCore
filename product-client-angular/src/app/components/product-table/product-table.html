@if (loading()) {
  <div class="text-center py-5">
    <div class="spinner-border text-primary" role="status"></div>
    <p class="mt-2 text-muted">Loading products…</p>
  </div>
} @else if (products().length === 0) {
  <div class="alert alert-light border text-center">No products yet. Add one using the form.</div>
} @else {
  <!-- table-responsive adds horizontal scrolling on small screens -->
  <div class="table-responsive card shadow-sm">
    <table class="table table-hover align-middle mb-0">
      <thead class="table-light">
        <tr>
          <th>#</th>
          <th>Name</th>
          <th class="d-none d-md-table-cell">Description</th>
          <th class="text-end">Price</th>
          <th class="text-end">Qty</th>
          <th class="text-end">Actions</th>
        </tr>
      </thead>
      <tbody>
        @for (p of products(); track p.id) {
          <tr [class.table-warning]="p.id === editingId()">
            <td>{{ p.id }}</td>
            <td class="fw-medium">{{ p.name }}</td>
            <td class="d-none d-md-table-cell text-muted">{{ p.description }}</td>
            <td class="text-end">{{ p.price | currency: 'USD' }}</td>
            <td class="text-end">{{ p.quantity }}</td>
            <td class="text-end text-nowrap">
              <button
                class="btn btn-sm btn-outline-primary me-2"
                [disabled]="disabled()"
                (click)="edit.emit(p)"
              >
                Edit
              </button>
              <button
                class="btn btn-sm btn-outline-danger"
                [disabled]="disabled()"
                (click)="remove.emit(p)"
              >
                Delete
              </button>
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
}
